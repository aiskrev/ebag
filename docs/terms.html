        <script>
            (function () {
                let latestChatbotToken = null;
                let druidWebchatLoad = null;

                // Called on login and logout too; before the script has run it only records the token
                // for the initialization that follows the script's load. Druid's init resolves once
                // the widget has loaded, and open() does nothing before that.
                function initializeDruidWebchat(freshChatbotToken = null) {
                    latestChatbotToken = freshChatbotToken;
                    if (!window.DruidWebchat_v2) {
                        return Promise.resolve();
                    }

                    const userToken = latestChatbotToken || null;
                    const botId = "7ed696b3-f5bd-4c4b-16dd-08dd9391fcca";
                    return window.DruidWebchat_v2.init({
                        botId,
                        baseUrl: 'https://druidapi.druidplatform.com',
                        queryParams: `UserToken=${userToken || 'unauthenticated'}&Language=${(document.documentElement.lang === 'en' ? 'en-US' : 'bg')}`,
                    });
                }

                // An injected script stays out of the deferred-script queue, so the chatbot's
                // multi-megabyte bundle never holds back main.js. A failed load is forgotten so that
                // opening the chat retries it.
                function loadDruidWebchat() {
                    druidWebchatLoad ??= new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://prod-druid-apc.azureedge.net/v2/druid_webchat_v2.js';
                        script.onload = resolve;
                        script.onerror = () => reject(new Error('DruidWebchat_v2 failed to load'));
                        document.head.append(script);
                    }).then(
                        () => initializeDruidWebchat(latestChatbotToken),
                        (error) => {
                            druidWebchatLoad = null;
                            throw error;
                        },
                    );

                    return druidWebchatLoad;
                }

                // Blocked or failed downloads are routine here (ad blockers); the chat button reports
                // them when someone actually asks for the chat.
                window.addEventListener('load', () => loadDruidWebchat().catch(() => {}));

                // Make them globally accessible for TypeScript.
                window.initializeDruidWebchat = initializeDruidWebchat;
                window.loadDruidWebchat = loadDruidWebchat;
            })();
        </script>
